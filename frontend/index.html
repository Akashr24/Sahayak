<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sahayak — ಸಹಾಯಕ | Shirva Senior Citizen Assistance</title>
  <meta name="description" content="Sahayak Community Assistance Platform for Senior Citizens. Shirva Police Station HPL 2026 PS 03. Supports Kannada, Hindi, Tamil, Telugu, Tulu, and English." />
  <meta name="theme-color" content="#070d1e" />

  <!-- Multilingual Font Support: Kannada, Hindi (Devanagari), Tamil, Telugu -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <!-- Liquid Glass SVG Distortion Filter -->
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="85" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
